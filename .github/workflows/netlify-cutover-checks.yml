name: Netlify cutover checks
on:
  push:
    branches:
      - feature/netlify-cutover-ready
  workflow_dispatch:
  pull_request:
    branches:
      - feature/netlify-blobs-staging

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Check privacy of deployed assets
        run: |
          test ! -d dist/data
          test ! -e dist/enxoval-compartilhar.html
          test ! -e dist/src/supabase-config.js
          test ! -e dist/src/netlify-data-service.js
          ! grep -R -E 'supabase[.]co|SUPABASE_URL' dist/
